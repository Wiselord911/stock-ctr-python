services:
  - type: worker
    name: stock-ctr-python
    env: python
    plan: free                      # ✅ ใช้แผนฟรี
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    autoDeploy: true

    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: GUILD_ID
        sync: false
      - key: DB_PATH
        value: /tmp/stock.db         # ✅ ฐานข้อมูลชั่วคราว (ฟรี ไม่มีค่าใช้จ่าย)
